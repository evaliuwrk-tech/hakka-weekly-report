<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>哈客組 週報填報系統</title>
<style>
  :root{
    --bg:#f4f1ea; --card:#ffffff; --ink:#2c2a26; --muted:#6f6a60;
    --line:#e4ddcf; --brand:#8a5a2b; --brand-2:#b07d45; --accent:#3b7a57;
    --ok:#2f8a54; --ok-bg:#e6f4ec; --no:#c14a4a; --no-bg:#fbeaea;
    --shadow:0 6px 24px rgba(60,45,20,.08); --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1c1a17; --card:#26231f; --ink:#efe9df; --muted:#a89f90;
      --line:#3a352e; --brand:#d1a06a; --brand-2:#b98a52; --accent:#6bbf92;
      --ok:#7ed4a3; --ok-bg:#1e3a2a; --no:#e88; --no-bg:#3a2422;
      --shadow:0 6px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Microsoft JhengHei","微軟正黑體",-apple-system,"Segoe UI",sans-serif;
    line-height:1.6;}
  .wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px;}
  header{display:flex;align-items:center;gap:12px;margin:8px 0 20px;flex-wrap:wrap;}
  .logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-2));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;flex:none;}
  h1{font-size:20px;margin:0;}
  .sub{color:var(--muted);font-size:13px;margin-top:2px;}
  .tabs{display:flex;gap:8px;margin:0 0 18px;}
  .tab{flex:1;padding:12px;border:1px solid var(--line);background:var(--card);border-radius:12px;
    cursor:pointer;font-size:15px;font-weight:700;color:var(--muted);text-align:center;transition:.15s;}
  .tab.active{color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand-2));border-color:transparent;box-shadow:var(--shadow);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;box-shadow:var(--shadow);margin-bottom:16px;}
  label{display:block;font-weight:700;font-size:14px;margin:16px 0 6px;}
  label .hint{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px;}
  .req{color:var(--no);}
  select,input[type=text],textarea{width:100%;padding:11px 12px;border:1px solid var(--line);
    border-radius:10px;background:var(--bg);color:var(--ink);font-size:15px;font-family:inherit;}
  textarea{min-height:96px;resize:vertical;line-height:1.6;}
  select:focus,input:focus,textarea:focus{outline:2px solid var(--brand-2);outline-offset:1px;border-color:transparent;}
  .weekrow{display:flex;align-items:center;gap:10px;}
  .weekrow .weekbox{flex:1;text-align:center;font-weight:800;font-size:16px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);}
  .weekrow .weekbox small{display:block;font-weight:400;color:var(--muted);font-size:12px;}
  .wbtn{width:44px;height:44px;flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);
    border-radius:10px;font-size:18px;cursor:pointer;}
  .wbtn:hover{border-color:var(--brand-2);}
  .actions{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;}
  .btn{padding:13px 20px;border:none;border-radius:11px;font-size:15px;font-weight:800;cursor:pointer;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:var(--shadow);}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .msg{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:14px;display:none;}
  .msg.show{display:block;}
  .msg.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok);}
  .msg.err{background:var(--no-bg);color:var(--no);border:1px solid var(--no);}
  .note{font-size:12.5px;color:var(--muted);margin-top:10px;}
  /* dashboard */
  .dash-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
  .pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:13px;font-weight:700;}
  .pill.ok{background:var(--ok-bg);color:var(--ok);}
  .pill.no{background:var(--no-bg);color:var(--no);}
  .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px;}
  th,td{border:1px solid var(--line);padding:9px 8px;text-align:center;}
  th{background:var(--bg);font-weight:800;}
  td.name,th.name{text-align:left;position:sticky;left:0;background:var(--card);font-weight:700;white-space:nowrap;}
  th.name{background:var(--bg);}
  th.cur{color:var(--brand);}
  .mark-ok{color:var(--ok);font-weight:900;font-size:16px;}
  .mark-no{color:var(--no);opacity:.6;font-size:15px;}
  td.cell.ok{background:var(--ok-bg);}
  .summary{font-size:15px;font-weight:700;margin:6px 0 16px;}
  .loading{color:var(--muted);padding:26px;text-align:center;}
  a.link{color:var(--brand);font-weight:700;}
  footer{color:var(--muted);font-size:12px;text-align:center;margin-top:24px;}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">

  <!-- ====================================================================== -->
  <!--  ★★★  設定區：請只修改這一塊  ★★★                                     -->
  <!--  1. teamName：你的組別名稱                                              -->
  <!--  2. members：組長 + 組員姓名（含你自己），用來當填報下拉選單             -->
  <!--  3. appsScriptUrl：部署 Apps Script 後拿到的網址（貼進引號內）          -->
  <!--  詳細步驟見「設定說明.md」                                              -->
  <!-- ====================================================================== -->
  <script>
  const CONFIG = {
    teamName: "哈客組",
    members: ["劉怡君（組長）", "涂政強", "黃敏琪", "劉美君"],
    appsScriptUrl: "https://script.google.com/macros/s/AKfycbxmNBzeGNv_bdx9LeSgk6vINCqybjwR0YtxpgJ4ocxR5ATq5cj2dV58wggvvMglKeWR/exec",
    weeksToShow: 8              // 看板顯示最近幾週
  };
  </script>
  <!-- ====================================================================== -->

  <header>
    <div class="logo">哈</div>
    <div>
      <h1 id="title">週報填報系統</h1>
      <div class="sub">每週五下班前填報 · 產生統一格式 Word 檔後上傳雲端資料夾</div>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" id="tab-form" onclick="switchTab('form')">📝 填週報</div>
    <div class="tab" id="tab-dash" onclick="switchTab('dash')">📊 進度看板</div>
  </div>

  <!-- ===================== 填報表單 ===================== -->
  <section id="view-form">
    <div class="card">
      <label>姓名 <span class="req">*</span></label>
      <select id="f-name"></select>

      <label>週次 <span class="hint">系統自動帶入本週，補交可用箭頭調整</span></label>
      <div class="weekrow">
        <button type="button" class="wbtn" onclick="shiftWeek(-1)" title="上一週">◀</button>
        <div class="weekbox"><span id="week-key">—</span><small id="week-range">—</small></div>
        <button type="button" class="wbtn" onclick="shiftWeek(1)" title="下一週">▶</button>
      </div>

      <label>一、本週進度 <span class="req">*</span></label>
      <textarea id="f-progress" placeholder="條列本週完成的事項，一行一項…"></textarea>

      <label>二、遇到的困難及預計處理方式 <span class="hint">如有</span></label>
      <textarea id="f-difficulties" placeholder="遇到什麼卡點、打算怎麼處理（沒有可留空）"></textarea>

      <label>三、下週規劃 <span class="req">*</span></label>
      <textarea id="f-nextplan" placeholder="下週預計要推進的工作…"></textarea>

      <label>備註 <span class="hint">選填</span></label>
      <textarea id="f-note" style="min-height:60px" placeholder=""></textarea>

      <div class="actions">
        <button class="btn" id="btn-gen" onclick="submitReport()">⬇ 產生 Word 週報並登記</button>
        <button class="btn ghost" onclick="clearForm()">清空</button>
      </div>
      <div class="msg" id="form-msg"></div>
      <div class="note">按下後會（1）下載命名好的 <b>.docx</b> 檔，請自行上傳到你組別的雲端資料夾；（2）在組長的追蹤表登記你已繳交。</div>
    </div>
  </section>

  <!-- ===================== 進度看板 ===================== -->
  <section id="view-dash" class="hidden">
    <div class="card">
      <div class="dash-top">
        <div class="summary" id="dash-summary">載入中…</div>
        <button class="btn ghost" onclick="loadDashboard()">🔄 重新整理</button>
      </div>
      <div id="dash-body">
        <div class="loading">載入中…</div>
      </div>
      <div class="note" id="dash-note"></div>
    </div>
  </section>

  <footer>哈客組 · 半自動雲端週報填報系統</footer>
</div>

<script>
/* ============================ 週次工具 ============================ */
function isoWeek(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return { year: d.getUTCFullYear(), week: weekNo };
}
function weekKeyOf(date){ const {year,week}=isoWeek(date); return year + "-W" + String(week).padStart(2,"0"); }
function weekRangeOf(date){
  const d = new Date(date);
  const day = (d.getDay()+6)%7;               // 週一=0
  const mon = new Date(d); mon.setDate(d.getDate()-day);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  const f = x => (x.getMonth()+1)+"/"+x.getDate();
  return f(mon)+"–"+f(sun);
}

/* 目前選定的週（以某一天代表該週） */
let currentWeekDate = new Date();
function refreshWeekDisplay(){
  document.getElementById("week-key").textContent   = weekKeyOf(currentWeekDate);
  document.getElementById("week-range").textContent = weekRangeOf(currentWeekDate);
}
function shiftWeek(delta){
  const d = new Date(currentWeekDate); d.setDate(d.getDate()+7*delta);
  currentWeekDate = d; refreshWeekDisplay();
}

/* ============================ 初始化 ============================ */
function initForm(){
  document.getElementById("title").textContent = CONFIG.teamName + " 週報填報系統";
  document.querySelector(".logo").textContent = (CONFIG.teamName||"哈")[0];
  const sel = document.getElementById("f-name");
  sel.innerHTML = '<option value="" disabled selected>— 請選擇 —</option>' +
    CONFIG.members.map(m=>`<option>${escapeHtml(m)}</option>`).join("");
  refreshWeekDisplay();
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function switchTab(which){
  const isForm = which==="form";
  document.getElementById("tab-form").classList.toggle("active", isForm);
  document.getElementById("tab-dash").classList.toggle("active", !isForm);
  document.getElementById("view-form").classList.toggle("hidden", !isForm);
  document.getElementById("view-dash").classList.toggle("hidden", isForm);
  if(!isForm) loadDashboard();
}
function clearForm(){
  ["f-progress","f-difficulties","f-nextplan","f-note"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("f-name").selectedIndex=0;
  currentWeekDate=new Date(); refreshWeekDisplay();
  showMsg("form-msg","","");
}
function showMsg(id, text, kind){
  const el=document.getElementById(id);
  el.textContent=text; el.className="msg"+(text?(" show "+kind):"");
}

/* ============================ 送出：下載 docx + 登記 ============================ */
async function submitReport(){
  const name = document.getElementById("f-name").value;
  const progress = document.getElementById("f-progress").value.trim();
  const difficulties = document.getElementById("f-difficulties").value.trim();
  const nextPlan = document.getElementById("f-nextplan").value.trim();
  const note = document.getElementById("f-note").value.trim();
  const week = weekKeyOf(currentWeekDate);
  const weekRange = weekRangeOf(currentWeekDate);

  if(!name){ showMsg("form-msg","請先選擇姓名。","err"); return; }
  if(!progress){ showMsg("form-msg","「本週進度」為必填。","err"); return; }
  if(!nextPlan){ showMsg("form-msg","「下週規劃」為必填。","err"); return; }

  const btn=document.getElementById("btn-gen"); btn.disabled=true;
  const payload={ name, week, weekRange, progress, difficulties, nextPlan, note,
                  filledAt:new Date().toLocaleString("zh-TW") };

  // 1) 產生並下載 .docx
  try{
    const blob = await buildDocxBlob(payload);
    const fname = `${CONFIG.teamName}_週報_${week}_${name}.docx`;
    downloadBlob(blob, fname);
  }catch(err){
    showMsg("form-msg","產生 Word 檔失敗："+err,"err"); btn.disabled=false; return;
  }

  // 2) 登記到組長追蹤表（Apps Script）
  if(CONFIG.appsScriptUrl){
    try{
      await fetch(CONFIG.appsScriptUrl,{
        method:"POST", mode:"no-cors",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify(payload)
      });
      showMsg("form-msg",`✅ 已下載「${CONFIG.teamName}_週報_${week}_${name}.docx」，並完成繳交登記。請把檔案上傳到你的雲端資料夾。`,"ok");
    }catch(err){
      showMsg("form-msg","檔案已下載，但登記失敗（可能是網路問題），請通知組長或稍後重試。","err");
    }
  }else{
    showMsg("form-msg","✅ 已下載 Word 檔（尚未設定登記網址，未登記繳交狀態）。","ok");
  }
  btn.disabled=false;
}

function downloadBlob(blob, filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

/* ============================ 零套件 .docx 產生器 ============================ */
/* 手工組出 OOXML 三個必要檔，再打包成 ZIP（stored 無壓縮），即為合法 .docx */
function xmlEsc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function runProps(bold, size, color){
  return `<w:rPr>${bold?"<w:b/>":""}<w:sz w:val="${size}"/><w:szCs w:val="${size}"/>`
       + (color?`<w:color w:val="${color}"/>`:"")
       + `<w:rFonts w:ascii="Calibri" w:eastAsia="微軟正黑體" w:hAnsi="Calibri"/></w:rPr>`;
}
function paras(text, {bold=false,size=22,after=120,color=null}={}){
  const t=(text==null||text==="")?"（無）":String(text);
  return t.split(/\r?\n/).map(line=>{
    const content = xmlEsc(line)===""?" ":xmlEsc(line);
    return `<w:p><w:pPr><w:spacing w:after="${after}"/></w:pPr>`
         + `<w:r>${runProps(bold,size,color)}<w:t xml:space="preserve">${content}</w:t></w:r></w:p>`;
  }).join("");
}
function heading(text){ return paras(text,{bold:true,size:26,after:60,color:"8A5A2B"}); }

function buildDocumentXml(p){
  const info = [
    `姓名：${p.name}`,
    `週次：${p.week}（${p.weekRange}）`,
    `填寫時間：${p.filledAt}`
  ].map(l=>paras(l,{size:20,after:40,color:"6F6A60"})).join("");

  let body = "";
  body += paras(`${CONFIG.teamName} 個人週報`, {bold:true,size:34,after:120});
  body += info;
  body += paras("", {size:8, after:60});
  body += heading("一、本週進度");
  body += paras(p.progress, {size:22, after:200});
  body += heading("二、遇到的困難及預計處理方式");
  body += paras(p.difficulties, {size:22, after:200});
  body += heading("三、下週規劃");
  body += paras(p.nextPlan, {size:22, after:200});
  if(p.note){ body += heading("備註"); body += paras(p.note,{size:22,after:200}); }

  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
    + `<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">`
    + `<w:body>${body}`
    + `<w:sectPr><w:pgSz w:w="11906" w:h="16838"/>`
    + `<w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr>`
    + `</w:body></w:document>`;
}

const DOCX_CONTENT_TYPES =
  `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
  + `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">`
  + `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>`
  + `<Default Extension="xml" ContentType="application/xml"/>`
  + `<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>`
  + `</Types>`;
const DOCX_RELS =
  `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`
  + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`
  + `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>`
  + `</Relationships>`;

async function buildDocxBlob(payload){
  const enc=new TextEncoder();
  const files=[
    {name:"[Content_Types].xml", data:enc.encode(DOCX_CONTENT_TYPES)},
    {name:"_rels/.rels",         data:enc.encode(DOCX_RELS)},
    {name:"word/document.xml",   data:enc.encode(buildDocumentXml(payload))}
  ];
  return makeZip(files,"application/vnd.openxmlformats-officedocument.wordprocessingml.document");
}

/* ---- 迷你 ZIP（stored / 無壓縮）---- */
const CRC_TABLE=(function(){const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32(bytes){let crc=0xFFFFFFFF;for(let i=0;i<bytes.length;i++)crc=(crc>>>8)^CRC_TABLE[(crc^bytes[i])&0xFF];return (crc^0xFFFFFFFF)>>>0;}
function makeZip(files, mime){
  const enc=new TextEncoder(); const chunks=[]; const central=[]; let offset=0;
  for(const f of files){
    const nameBytes=enc.encode(f.name); const crc=crc32(f.data); const size=f.data.length;
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true);
    h.setUint16(8,0,true); h.setUint16(10,0,true); h.setUint16(12,0,true);
    h.setUint32(14,crc,true); h.setUint32(18,size,true); h.setUint32(22,size,true);
    h.setUint16(26,nameBytes.length,true); h.setUint16(28,0,true);
    chunks.push(new Uint8Array(h.buffer), nameBytes, f.data);
    central.push({nameBytes,crc,size,off:offset});
    offset += 30 + nameBytes.length + size;
  }
  const cdChunks=[]; let cdSize=0;
  for(const c of central){
    const h=new DataView(new ArrayBuffer(46));
    h.setUint32(0,0x02014b50,true); h.setUint16(4,20,true); h.setUint16(6,20,true);
    h.setUint16(8,0x0800,true); h.setUint16(10,0,true); h.setUint16(12,0,true); h.setUint16(14,0,true);
    h.setUint32(16,c.crc,true); h.setUint32(20,c.size,true); h.setUint32(24,c.size,true);
    h.setUint16(28,c.nameBytes.length,true); h.setUint16(30,0,true); h.setUint16(32,0,true);
    h.setUint16(34,0,true); h.setUint16(36,0,true); h.setUint32(38,0,true); h.setUint32(42,c.off,true);
    cdChunks.push(new Uint8Array(h.buffer), c.nameBytes);
    cdSize += 46 + c.nameBytes.length;
  }
  const eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true); eo.setUint16(8,central.length,true); eo.setUint16(10,central.length,true);
  eo.setUint32(12,cdSize,true); eo.setUint32(16,offset,true); eo.setUint16(20,0,true);
  return new Blob([...chunks,...cdChunks,new Uint8Array(eo.buffer)],{type:mime||"application/zip"});
}

/* ============================ 進度看板 ============================ */
function recentWeeks(n){
  const arr=[]; const base=new Date();
  for(let i=0;i<n;i++){
    const d=new Date(base); d.setDate(base.getDate()-7*i);
    arr.push({ key:weekKeyOf(d), num:isoWeek(d).week, range:weekRangeOf(d) });
  }
  return arr; // 新→舊
}
let dashLoading=false;
function loadDashboard(){
  if(dashLoading) return;
  if(!CONFIG.appsScriptUrl){
    document.getElementById("dash-summary").textContent="尚未設定登記網址";
    document.getElementById("dash-body").innerHTML='<div class="loading">請先在檔案上方 CONFIG 填入 appsScriptUrl（見設定說明）。</div>';
    return;
  }
  dashLoading=true;
  document.getElementById("dash-body").innerHTML='<div class="loading">載入中…</div>';
  const cb="hakkaCb_"+Date.now();
  const timer=setTimeout(()=>{ cleanup(); fail("連線逾時，請確認 Apps Script 已部署為「任何人皆可存取」。"); },12000);
  function cleanup(){ try{delete window[cb];}catch(e){window[cb]=undefined;} if(s.parentNode)s.remove(); clearTimeout(timer); dashLoading=false; }
  function fail(m){ document.getElementById("dash-summary").textContent="讀取失敗";
    document.getElementById("dash-body").innerHTML='<div class="loading">'+m+'</div>'; }
  window[cb]=function(res){ cleanup(); renderDashboard((res&&res.rows)||[]); };
  const s=document.createElement("script");
  s.src=CONFIG.appsScriptUrl+"?callback="+cb+"&t="+Date.now();
  s.onerror=function(){ cleanup(); fail("無法連線到登記網址，請檢查 appsScriptUrl 是否正確。"); };
  document.body.appendChild(s);
}
function renderDashboard(rows){
  const weeks=recentWeeks(CONFIG.weeksToShow);
  const submitted={}; // name -> weekKey -> time
  rows.forEach(r=>{
    if(!r.name||!r.week) return;
    (submitted[r.name]=submitted[r.name]||{})[r.week]=r.time||"已繳交";
  });
  const members=CONFIG.members;
  const curKey=weeks[0].key, curNum=weeks[0].num;

  // 本週彙總
  const done=members.filter(m=>submitted[m]&&submitted[m][curKey]);
  const missing=members.filter(m=>!(submitted[m]&&submitted[m][curKey]));
  const sumEl=document.getElementById("dash-summary");
  sumEl.innerHTML = `本週（W${curNum} ${weeks[0].range}）繳交：`
    + `<span class="pill ${missing.length?'no':'ok'}">${done.length}/${members.length}</span>`
    + (missing.length?`　尚缺：<b>${missing.map(escapeHtml).join("、")}</b>`:`　🎉 全員繳齊`);

  // 表格
  let html='<div class="tablewrap"><table><thead><tr><th class="name">成員 ＼ 週次</th>';
  weeks.forEach((w,i)=>{ html+=`<th class="${i===0?'cur':''}">W${w.num}<br><small style="font-weight:400;color:var(--muted)">${w.range}</small></th>`; });
  html+='</tr></thead><tbody>';
  members.forEach(m=>{
    html+=`<tr><td class="name">${escapeHtml(m)}</td>`;
    weeks.forEach(w=>{
      const t=submitted[m]&&submitted[m][w.key];
      html+= t
        ? `<td class="cell ok"><span class="mark-ok" title="${escapeHtml(String(t))}">✓</span></td>`
        : `<td class="cell"><span class="mark-no">✗</span></td>`;
    });
    html+='</tr>';
  });
  html+='</tbody></table></div>';
  document.getElementById("dash-body").innerHTML=html;
  document.getElementById("dash-note").innerHTML=
    '✓＝已在系統登記繳交（滑鼠移到 ✓ 可看繳交時間）。週報「內文」保存在你的私人 Google 試算表，看板僅顯示繳交狀態。';
}

/* ============================ 啟動 ============================ */
initForm();
</script>
